name: seed-corpus

on:
  push:
    branches: [main]
    paths: ['corpus/chunks/**']
  workflow_dispatch:

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Open tunnel to private Postgres
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway connect Postgres --tunnel-only --ssh -P 55432 &
          for i in $(seq 1 30); do
            nc -z localhost 55432 && break
            sleep 1
          done

      - name: Embed corpus
        working-directory: server
        env:
          DATABASE_URL: postgres://postgres:${{ secrets.PROD_DB_PASSWORD }}@localhost:55432/railway
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          for f in ../corpus/chunks/*.jsonl; do
            go run ./cmd/corpus embed --replace "$f"
          done
